services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: hwaln
      POSTGRES_USER: hwaln
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - hwaln_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hwaln -d hwaln"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hwaln_postgres: